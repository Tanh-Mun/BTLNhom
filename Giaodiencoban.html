<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt lịch tư vấn giảng viên Ngoại ngữ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;0,9..144,680;1,9..144,500&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2B45; --ink-soft:#3C4A63;
    --paper:#E9E4D6; --paper-dark:#DDD6C2; --paper-card:#F2EEE2;
    --brass:#A9812F; --brass-deep:#8A6A24; --brass-bg:#F3E6C4;
    --sage:#5C7A5E; --sage-bg:#E3E9E0;
    --sky:#3E6B8A; --sky-bg:#DCE6EC;
    --rust:#A3492F; --rust-bg:#F0DFD6;
    --line:#C9C1AC; --line-soft:#DAD3BF;
    --shadow: 0 8px 24px rgba(28,43,69,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:
      repeating-linear-gradient(90deg, rgba(28,43,69,0.02) 0px, rgba(28,43,69,0.02) 1px, transparent 1px, transparent 96px),
      var(--paper);
    color:var(--ink); font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces', serif; margin:0;}
  p{margin:0;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  button, select, input, textarea{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--brass); outline-offset:2px;}

  /* ---------- TOPBAR ---------- */
  .topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 24px; background:var(--paper-dark); border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:34px;height:34px;border-radius:8px; background:var(--ink); color:var(--paper);
    display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-weight:680; font-size:14px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);}
  .brand .name{font-family:'Fraunces',serif; font-weight:680; font-size:18px; line-height:1.1;}
  .brand .sub{font-size:11px; letter-spacing:.06em; color:var(--ink-soft); text-transform:uppercase;}
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .mybookings-btn{position:relative; display:flex; align-items:center; gap:8px; background:var(--brass); color:#fff;
    border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:500; box-shadow: var(--shadow);
    transition: transform .15s ease;}
  .mybookings-btn:hover{transform:translateY(-1px);}
  .mybookings-btn .badge{background:var(--ink); color:#fff; font-size:11px; min-width:18px; height:18px;
    border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 4px;}

  /* ---------- TAB NAV (folder tabs) ---------- */
  .tabnav{display:flex; gap:4px; padding:14px 24px 0; max-width:1240px; margin:0 auto; overflow-x:auto;}
  .tabbtn{flex:0 0 auto; background:var(--paper-dark); border:1px solid var(--line); border-bottom:none;
    border-radius:10px 10px 0 0; padding:10px 18px; font-size:13.5px; font-weight:500; color:var(--ink-soft);
    transform:translateY(2px); transition:transform .15s ease, background .15s ease, color .15s ease;}
  .tabbtn.active{background:var(--paper-card); color:var(--ink); font-weight:600; transform:translateY(0);
    box-shadow: 0 -2px 0 var(--brass) inset;}
  .tabcontent-wrap{background:var(--paper-card); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}

  .page{max-width:1240px; margin:0 auto; padding:26px 24px 60px;}
  @media (max-width:900px){ .page{padding:20px 16px 40px;} .topbar{padding:12px 16px;} .tabnav{padding:12px 16px 0;} }

  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px;}
  .section-title{font-size:20px; margin-bottom:4px;}
  .section-desc{font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}

  input, select, textarea{border:1px solid var(--line); background:#fff; border-radius:8px; padding:9px 11px;
    font-size:13.5px; color:var(--ink);}
  textarea{resize:vertical;}
  label.field-label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;
    text-transform:uppercase; letter-spacing:.04em;}

  .btn{border:none; border-radius:8px; padding:9px 15px; font-size:13px; font-weight:600; transition:transform .12s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--brass); color:#fff;}
  .btn-sky{background:var(--sky); color:#fff;}
  .btn-sage{background:var(--sage); color:#fff;}
  .btn-danger{background:var(--rust); color:#fff;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-sm{padding:6px 11px; font-size:12px;}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}

  .badge-status{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:3px 9px; border-radius:999px;}
  .badge-available{background:var(--sage-bg); color:var(--sage);}
  .badge-closed{background:#EDEAE0; color:var(--ink-soft);}
  .badge-pending{background:var(--brass-bg); color:var(--brass-deep);}
  .badge-approved{background:var(--sky-bg); color:var(--sky);}
  .badge-completed{background:var(--ink); color:#fff;}
  .badge-rejected, .badge-cancelled{background:var(--rust-bg); color:var(--rust);}

  /* ========== TAB 1: ĐẶT LỊCH ========== */
  .search-card{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr auto; gap:10px; align-items:end;}
  @media (max-width:900px){ .search-card{grid-template-columns:1fr 1fr;} }
  .search-card .btn{height:38px;}

  .lecturer-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; margin-top:18px;}
  .lect-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:10px;
    transition:transform .12s ease, box-shadow .12s ease;}
  .lect-card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .lect-top{display:flex; gap:12px; align-items:center;}
  .avatar{width:42px;height:42px;border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:680; font-size:15px; color:#fff;}
  .lect-name{font-size:14.5px; font-weight:600;}
  .lect-unit{font-size:11.5px; color:var(--ink-soft);}
  .topic-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{font-size:11px; background:var(--paper-card); border:1px solid var(--line); color:var(--ink-soft);
    padding:3px 9px; border-radius:999px;}
  .lect-foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px; border-top:1px solid var(--line-soft);}
  .lect-avail{font-size:12px; color:var(--sage); font-weight:600;}
  .empty-mini{text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px;}

  /* ========== PANEL (drawer) ========== */
  .backdrop{position:fixed; inset:0; background:rgba(28,43,69,0.35); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .backdrop.show{opacity:1; pointer-events:auto;}
  .panel{position:fixed; top:0; right:0; height:100%; width:440px; max-width:94vw; background:var(--paper-card);
    z-index:50; box-shadow:-10px 0 30px rgba(28,43,69,0.2); transform:translateX(100%); transition:transform .25s ease;
    display:flex; flex-direction:column;}
  .panel.show{transform:translateX(0);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line);}
  .panel-head h3{font-size:18px;}
  .panel-close{background:transparent; border:none; font-size:20px; color:var(--ink-soft); line-height:1; padding:4px;}
  .panel-body{padding:20px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px;}

  .plaque{position:relative; background:linear-gradient(180deg,#23324E 0%, var(--ink) 100%); color:var(--paper);
    border-radius:14px; padding:18px 20px;}
  .plaque .pname{font-size:19px; font-weight:680;}
  .plaque .punit{font-size:12px; color:#C8CFE0; margin-top:3px;}
  .plaque .pbio{font-size:12.5px; color:#B9C2DA; margin-top:10px; line-height:1.5;}
  .plaque .ptags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .plaque .ptags span{font-size:10.5px; background:rgba(255,255,255,0.12); padding:3px 9px; border-radius:999px;}

  .daytabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
  .daytab{flex:0 0 auto; min-width:64px; text-align:center; background:#fff; border:1px solid var(--line);
    border-radius:9px; padding:8px 10px; font-size:11.5px; font-weight:500; color:var(--ink-soft);}
  .daytab .d{display:block; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink); font-weight:600;}
  .daytab.active{background:var(--ink); border-color:var(--ink);}
  .daytab.active, .daytab.active .d{color:var(--paper);}

  .slot-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:8px;}
  .slot{position:relative; text-align:left; border:1px solid var(--line); border-radius:8px; padding:9px 10px 9px 14px;
    background:#fff; transition:transform .12s ease;}
  .slot::before{content:''; position:absolute; left:0; top:0; bottom:0; width:5px;
    background-image: radial-gradient(circle, var(--paper-card) 2px, transparent 2.1px);
    background-size: 5px 9px; background-repeat:repeat-y; background-position:center;
    border-right:1px dashed var(--line-soft);}
  .slot .time{font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:500;}
  .slot .st{display:block; font-size:10.5px; margin-top:2px; font-weight:600;}
  .slot[data-status="available"]{cursor:pointer;}
  .slot[data-status="available"]:hover{transform:translateY(-2px);}
  .slot[data-status="available"] .st{color:var(--sage);}
  .slot[data-status="closed"]{background:#EDEAE0; opacity:.7; cursor:default;}
  .slot[data-status="closed"] .st{color:var(--ink-soft);}
  .slot[data-status="pending"]{background:var(--brass-bg); border-color:#D9C48F;}
  .slot[data-status="pending"] .st{color:var(--brass-deep);}
  .slot[data-status="approved"]{background:var(--sky-bg); border-color:#B9CBD8;}
  .slot[data-status="approved"] .st{color:var(--sky);}
  .slot[data-status="completed"]{background:#E4E2DC; border-color:var(--line);}
  .slot[data-status="completed"] .st{color:var(--ink-soft);}
  .slot[data-status="mine"]{cursor:pointer; box-shadow:0 0 0 2px var(--brass) inset;}

  .info-line{display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px solid var(--line-soft); gap:10px;}
  .info-line span:first-child{color:var(--ink-soft); flex-shrink:0;}
  .info-line span:last-child{font-weight:600; text-align:right;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}

  .booking-item{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:6px;}
  .bi-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .bi-name{font-weight:600; font-size:13.5px;}
  .bi-time{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--brass-deep); white-space:nowrap;}
  .bi-topic{font-size:12px; color:var(--ink-soft);}
  .bi-actions{display:flex; gap:8px; margin-top:4px;}

  .stars{display:flex; gap:4px;}
  .star-btn{background:none; border:none; font-size:22px; color:var(--line); padding:0; line-height:1;}
  .star-btn.on{color:var(--brass);}
  .stars-display{font-size:13px; color:var(--brass);}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink);
    color:var(--paper); padding:12px 20px; border-radius:10px; font-size:13.5px; box-shadow:var(--shadow); z-index:60;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ========== TAB 2: GIẢNG VIÊN ========== */
  .lecturer-shell{display:grid; grid-template-columns:260px 1fr; gap:20px;}
  @media (max-width:900px){ .lecturer-shell{grid-template-columns:1fr;} }
  .stack{display:flex; flex-direction:column; gap:18px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{font-size:12px; background:var(--paper-card); border:1px solid var(--line); color:var(--ink-soft);
    padding:5px 10px; border-radius:999px; display:flex; align-items:center; gap:6px;}
  .chip button{background:none; border:none; color:var(--rust); font-weight:700; padding:0; font-size:12px;}
  .addtopic-row{display:flex; gap:8px; margin-top:8px;}
  .addtopic-row input{flex:1;}

  .subtabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .subtab{background:var(--paper-card); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:12.5px; color:var(--ink-soft); font-weight:500;}
  .subtab.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .slot-row{display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; background:#fff; flex-wrap:wrap;}
  .slot-row .st-time{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px; min-width:56px;}
  .slot-row .st-meta{font-size:12px; color:var(--ink-soft); flex:1; min-width:120px;}
  .slot-row .st-actions{display:flex; gap:6px; margin-left:auto;}
  .add-slot-form{display:flex; gap:8px; align-items:end; margin-top:10px; flex-wrap:wrap;}

  .req-item{border:1px solid var(--line); border-radius:10px; padding:14px; background:#fff; margin-bottom:10px;}
  .req-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .req-student{font-weight:600; font-size:14px;}
  .req-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .req-note{font-size:12.5px; color:var(--ink-soft); margin-top:8px; background:var(--paper-card); border-radius:8px; padding:8px 10px;}
  .req-actions{display:flex; gap:8px; margin-top:10px;}
  .req-feedback{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-soft); font-size:12.5px;}

  /* ========== TAB 3: THỐNG KÊ ========== */
  .stat-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:20px;}
  .stat-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; text-align:center;}
  .stat-card .n{font-family:'Fraunces',serif; font-size:30px; font-weight:680; color:var(--ink);}
  .stat-card .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:4px;}

  table.stats-table{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  table.stats-table th, table.stats-table td{padding:10px 14px; text-align:left; font-size:13px; border-bottom:1px solid var(--line-soft);}
  table.stats-table th{background:var(--paper-card); font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);}
  .bar-wrap{background:var(--paper-card); border-radius:6px; overflow:hidden; height:8px; width:120px;}
  .bar-fill{background:var(--brass); height:100%;}

  /* ========== TAB 4: API ========== */
  .api-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:900px){ .api-grid{grid-template-columns:1fr;} }
  .endpoint-tag{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--sage-bg); color:var(--sage);
    padding:4px 10px; border-radius:6px; font-weight:600; margin-bottom:10px;}
  /* ========== TAB 0: TRANG CHỦ — bảng hội thoại đa ngôn ngữ ========== */
  :root{
    --h2-bg:#F5F3FA; --h2-ink:#211B33; --h2-sub:#655F7A;
    --h2-violet:#5B4FE8; --h2-violet-deep:#41359E;
    --h2-coral:#E4572E; --h2-blue:#2F80ED; --h2-mint:#0E8F70; --h2-gold:#D69A00;
    --h2-line:#E4DFF2;
  }
  .h2-shell{background:var(--h2-bg); border:1px solid var(--h2-line); border-radius:28px; overflow:hidden;}
  .h2-hero{display:grid; grid-template-columns:1.15fr 0.85fr; gap:40px; align-items:center; padding:54px 44px 40px;}
  @media (max-width:820px){ .h2-hero{grid-template-columns:1fr; padding:38px 24px 28px;} }

  .h2-eyebrow{display:inline-flex; align-items:center; gap:8px; background:#fff; border:2px solid var(--h2-ink);
    border-radius:999px; padding:7px 16px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px;
    letter-spacing:.01em; margin-bottom:22px; color:var(--h2-ink);}
  .h2-eyebrow .dot{width:8px; height:8px; border-radius:50%; background:var(--h2-violet); flex-shrink:0;}

  .h2-hero h1{font-family:'Space Grotesk',sans-serif; font-size:42px; line-height:1.1; font-weight:700;
    color:var(--h2-ink); letter-spacing:-.01em;}
  .h2-hero h1 .hl{color:var(--h2-violet);}
  @media (max-width:560px){ .h2-hero h1{font-size:30px;} }
  .h2-hero .lead{font-family:'IBM Plex Sans',sans-serif; font-size:14.5px; color:var(--h2-sub); margin-top:18px;
    max-width:440px; line-height:1.7;}

  .h2-cta-row{display:flex; gap:14px; margin-top:30px; flex-wrap:wrap;}
  .h2-btn{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; padding:13px 24px;
    border-radius:999px; border:2.5px solid var(--h2-ink); transition:transform .15s ease, box-shadow .15s ease; cursor:pointer;}
  .h2-btn-solid{background:var(--h2-ink); color:#fff; box-shadow:3px 3px 0 var(--h2-violet);}
  .h2-btn-solid:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--h2-violet);}
  .h2-btn-outline{background:#fff; color:var(--h2-ink); box-shadow:3px 3px 0 var(--h2-ink);}
  .h2-btn-outline:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--h2-ink);}

  .bubble-cluster{display:flex; flex-direction:column; gap:12px;}
  .bubble{max-width:250px; padding:13px 17px; border-radius:18px; border:2.5px solid var(--h2-ink);
    box-shadow:3px 3px 0 var(--h2-ink); font-family:'IBM Plex Sans',sans-serif;
    opacity:0; transform:translateY(14px) scale(.95); animation:bubble-in .45s ease forwards;}
  .bubble .script{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; display:block; color:var(--h2-ink);}
  .bubble .tag{font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.65; margin-top:3px; display:block; color:var(--h2-ink);}
  @keyframes bubble-in{ to{opacity:1; transform:translateY(0) scale(1);} }
  @media (prefers-reduced-motion:reduce){ .bubble{animation:none; opacity:1; transform:none;} }

  .h2-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:6px 44px 0;}
  @media (max-width:700px){ .h2-stats{grid-template-columns:repeat(2,1fr); padding:6px 24px 0;} }
  .h2-stat{border-radius:18px; padding:20px; color:#fff; border:2.5px solid var(--h2-ink); box-shadow:3px 3px 0 var(--h2-ink);}
  .h2-stat .n{font-family:'Space Grotesk',sans-serif; font-size:28px; font-weight:700;}
  .h2-stat .l{font-family:'IBM Plex Sans',sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; margin-top:4px; opacity:.92;}

  .h2-section{padding:54px 44px 8px;}
  @media (max-width:700px){ .h2-section{padding:44px 24px 4px;} }
  .h2-section-label{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:23px; color:var(--h2-ink); margin-bottom:5px;}
  .h2-section-sub{font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; color:var(--h2-sub); margin-bottom:26px;}

  .chat-thread{display:flex; flex-direction:column; gap:11px; max-width:540px;}
  .msg{max-width:80%; padding:11px 16px; border-radius:18px; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px;
    line-height:1.5; border:2px solid var(--h2-ink); opacity:0; transform:translateY(10px); animation:bubble-in .4s ease forwards;}
  .msg.user{align-self:flex-end; background:var(--h2-violet); color:#fff; border-color:var(--h2-violet-deep); border-bottom-right-radius:4px;}
  .msg.sys{align-self:flex-start; background:#fff; color:var(--h2-ink); border-bottom-left-radius:4px;}

  .lang-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:16px;}
  .lang-card{border-radius:20px; border:2.5px solid var(--h2-ink); padding:20px; cursor:pointer; text-align:left;
    background:#fff; transition:transform .15s ease, box-shadow .15s ease; box-shadow:3px 3px 0 var(--h2-ink); display:block; width:100%;}
  .lang-card:hover{transform:translate(-3px,-3px); box-shadow:6px 6px 0 var(--h2-ink);}
  .lang-card .ldot{display:block; width:10px; height:10px; border-radius:3px; margin-bottom:12px;}
  .lang-card .script{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; display:block; margin-bottom:8px; color:var(--h2-ink);}
  .lang-card .name{font-weight:600; font-size:13.5px; color:var(--h2-ink); font-family:'IBM Plex Sans',sans-serif;}
  .lang-card .count{font-size:11px; color:var(--h2-sub); font-family:'IBM Plex Mono',monospace; display:block; margin-top:4px;}

  .feat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:16px;}
  .feat-card{background:#fff; border:2.5px solid var(--h2-ink); border-radius:20px; padding:18px;
    box-shadow:3px 3px 0 var(--h2-ink); transition:transform .15s ease, box-shadow .15s ease; cursor:pointer;}
  .feat-card:hover{transform:translate(-3px,-3px); box-shadow:6px 6px 0 var(--h2-ink);}
  .feat-avatar{width:44px; height:44px; border-radius:50%; border:2.5px solid var(--h2-ink); display:flex; align-items:center;
    justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; margin-bottom:12px;}
  .feat-name{font-weight:600; font-size:13.5px; color:var(--h2-ink); font-family:'IBM Plex Sans',sans-serif;}
  .feat-topic{font-size:11.5px; color:var(--h2-sub); margin-top:3px; font-family:'IBM Plex Sans',sans-serif;}
  .feat-cta{margin-top:14px; display:inline-block; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; color:var(--h2-violet);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">NN</div>
    <div>
      <div class="name">Giờ Hẹn Ngoại Ngữ</div>
      <div class="sub">Hệ thống đặt lịch tư vấn giảng viên</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="mybookings-btn" id="myBookingsBtn">Lịch hẹn của tôi <span class="badge" id="myBookingsCount">0</span></button>
  </div>
</div>

<div class="tabnav" id="tabNav">
  <button class="tabbtn active" data-tab="home">Trang chủ</button>
  <button class="tabbtn" data-tab="book">Tìm &amp; đặt lịch</button>
  <button class="tabbtn" data-tab="lecturer">Giảng viên</button>
  <button class="tabbtn" data-tab="stats">Thống kê</button>
  <button class="tabbtn" data-tab="api">API</button>
</div>
<div class="tabcontent-wrap"><div class="page" id="tabContent"></div></div>

<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel">
  <div class="panel-head"><h3 id="panelTitle">—</h3><button class="panel-close" id="panelClose">✕</button></div>
  <div class="panel-body" id="panelBody"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ================= DATA ================= */
const WEEKDAY_NAMES = ['CN','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const TIMES = ['08:00','09:30','14:00','15:30'];
const COLORS = ['#A9812F','#5C7A5E','#3C4A63','#A3492F','#6C6A8F','#4E7C82','#8A5A6E','#5E7A9E'];

const LECTURERS_SEED = [
  {id:'l1', name:'Hà Trang', unit:'Tiếng Anh', topics:['Giao tiếp & Phát âm'], office:'Phòng C102', bio:'8 năm giảng dạy kỹ năng nói và phát âm chuẩn quốc tế.'},
  {id:'l2', name:'TS. Nguyễn Hải Yến', unit:'Tiếng Anh', topics:['Luyện thi IELTS'], office:'Phòng C104', bio:'Chuyên gia luyện thi IELTS, học viên đạt trung bình 7.0+.'},
  {id:'l3', name:'ThS. Bùi Anh Tuấn', unit:'Tiếng Anh', topics:['Ngữ pháp & Viết học thuật'], office:'Phòng C108', bio:'Hướng dẫn viết luận và ngữ pháp học thuật cho sinh viên năm cuối.'},
  {id:'l4', name:'ThS. Phan Thị Ngọc Mai', unit:'Tiếng Nhật', topics:['Luyện thi JLPT'], office:'Phòng D201', bio:'Ôn luyện JLPT N3–N1, phương pháp ghi nhớ Kanji hiệu quả.'},
  {id:'l5', name:'TS. Đặng Văn Hùng', unit:'Tiếng Nhật', topics:['Giao tiếp thương mại'], office:'Phòng D203', bio:'Từng công tác tại doanh nghiệp Nhật, tư vấn tiếng Nhật văn phòng.'},
  {id:'l6', name:'ThS. Trần Lệ Quyên', unit:'Tiếng Trung', topics:['Luyện thi HSK'], office:'Phòng D210', bio:'Chuyên luyện thi HSK 3–6, xây dựng lộ trình học cá nhân hoá.'},
  {id:'l7', name:'ThS. Vũ Thị Kim Ngân', unit:'Tiếng Trung', topics:['Giao tiếp & Phiên dịch'], office:'Phòng D212', bio:'Kinh nghiệm phiên dịch hội nghị, hỗ trợ kỹ năng nghe nói thực tế.'},
  {id:'l8', name:'ThS. Lâm Gia Huy', unit:'Tiếng Hàn', topics:['Luyện thi TOPIK'], office:'Phòng D220', bio:'Hướng dẫn chiến lược làm bài TOPIK I và II.'},
  {id:'l9', name:'TS. Đinh Phương Anh', unit:'Tiếng Hàn', topics:['Văn hoá & Giao tiếp'], office:'Phòng D222', bio:'Nghiên cứu văn hoá Hàn Quốc, tư vấn giao tiếp trong môi trường công sở.'},
  {id:'l10', name:'ThS. Nguyễn Đức Thịnh', unit:'Tiếng Pháp', topics:['Luyện thi DELF/DALF'], office:'Phòng D230', bio:'Luyện thi chứng chỉ DELF/DALF các cấp độ A1–C1.'},
];

const STUDENTS = ['Nguyễn Văn An','Trần Thị Bích','Lê Hoàng Cường','Phạm Thu Dung','Đỗ Minh Đức','Vũ Ngọc Hà','Hoàng Anh Kiệt'];
const NOTES = ['Muốn ôn tập trước kỳ thi sắp tới.','Cần tư vấn lộ trình học phù hợp.','Gặp khó khăn ở kỹ năng nghe nói.','Muốn trao đổi thêm về tài liệu tự học.','Cần góp ý cho bài luận đã viết.'];
const FEEDBACK_COMMENTS = ['Giảng viên tư vấn rất tận tình, dễ hiểu.','Buổi hẹn hữu ích, có thêm định hướng rõ ràng.','Giải đáp đúng trọng tâm câu hỏi của em.','Mong có thêm tài liệu tham khảo sau buổi hẹn.','Rất hài lòng, sẽ đặt lịch tiếp vào tuần sau.'];

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
function initialsOf(name){ const p=name.replace(/^(TS\.|ThS\.|PGS\.TS\.)\s*/,'').trim().split(' '); return (p[p.length-1][0]||'?').toUpperCase(); }
function pad2(n){ return String(n).padStart(2,'0'); }
function isoOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function labelOf(d){ return pad2(d.getDate())+'/'+pad2(d.getMonth()+1); }

function generateDates(n){
  const out=[]; const d=new Date(); d.setHours(0,0,0,0);
  while(out.length<n){
    const dow=d.getDay();
    if(dow>=1 && dow<=5){ out.push({iso:isoOf(d), label:labelOf(d), weekday:WEEKDAY_NAMES[dow]}); }
    d.setDate(d.getDate()+1);
  }
  return out;
}

const LECTURERS = LECTURERS_SEED.map((l,i)=>({...l, topics:[...l.topics], color:COLORS[i%COLORS.length], initials:initialsOf(l.name)}));
const UNITS = ['Tất cả', ...Array.from(new Set(LECTURERS.map(l=>l.unit)))];
const DATES = generateDates(10);

function makeAppointment(slotId, lec, date, time, status, h){
  const ap = {
    id:'ap-'+slotId, slotId, lecturerId:lec.id, date, time,
    topic: lec.topics[h % lec.topics.length],
    studentName: STUDENTS[h % STUDENTS.length],
    contact: 'sv' + (h % 900 + 100) + '@sv.edu.vn',
    note: NOTES[h % NOTES.length],
    status, feedback:null, createdAt: date
  };
  if(status === 'completed'){
    ap.feedback = { rating: (h % 5) + 1, comment: FEEDBACK_COMMENTS[h % FEEDBACK_COMMENTS.length] };
  }
  return ap;
}

function generateData(){
  const slots = []; const appointments = {};
  LECTURERS.forEach(lec=>{
    DATES.forEach(dt=>{
      TIMES.forEach(time=>{
        const id = `${lec.id}_${dt.iso}_${time}`;
        const h = hashStr(id);
        const slot = {id, lecturerId:lec.id, date:dt.iso, time, session: time < '12:00' ? 'AM':'PM', baseStatus:'available', appointmentId:null};
        const b = h % 20;
        if(b === 0){ slot.baseStatus = 'closed'; }
        else if(b>=1 && b<=2){ const ap=makeAppointment(id,lec,dt.iso,time,'pending',h); appointments[ap.id]=ap; slot.appointmentId=ap.id; }
        else if(b>=3 && b<=4){ const ap=makeAppointment(id,lec,dt.iso,time,'approved',h); appointments[ap.id]=ap; slot.appointmentId=ap.id; }
        else if(b === 5){ const ap=makeAppointment(id,lec,dt.iso,time,'completed',h); appointments[ap.id]=ap; slot.appointmentId=ap.id; }
        slots.push(slot);
      });
    });
  });
  return {slots, appointments};
}

/* ================= STATE ================= */
const seed = generateData();
const state = {
  tab: 'home',
  slots: seed.slots,
  appointments: seed.appointments,
  myBookingIds: [],           // appointment ids created by "current student" this session
  search: { name:'', unit:'Tất cả', topic:'Tất cả', date:'Tất cả' },
  panel: { mode:null, lecturerId:null, slotId:null, apId:null, day:0 },
  lecturerLoginId: LECTURERS[0].id,
  lecturerSubtab: 'profile',   // profile | slots | requests
  slotsDay: DATES[0].iso,
  reqFilter: 'pending',
  pendingDelete: null,
  api: { lecturerId: LECTURERS[0].id, date: DATES[0].iso, result:null },
  newTopicDraft: '',
  bookingRating: 0,
};

function allTopics(){ return Array.from(new Set(LECTURERS.flatMap(l=>l.topics))); }
function lecturerById(id){ return LECTURERS.find(l=>l.id===id); }
function slotById(id){ return state.slots.find(s=>s.id===id); }
function apById(id){ return state.appointments[id]; }
function slotsFor(lecturerId){ return state.slots.filter(s=>s.lecturerId===lecturerId); }
function slotStatus(s){ if(s.appointmentId){ return apById(s.appointmentId).status; } return s.baseStatus; }
function dateInfo(iso){ return DATES.find(d=>d.iso===iso); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast._tm); showToast._tm=setTimeout(()=>t.classList.remove('show'),2500); }

const STATUS_LABEL = {available:'Còn trống', closed:'Đã đóng', pending:'Chờ duyệt', approved:'Đã duyệt', completed:'Hoàn thành', rejected:'Bị từ chối', cancelled:'Đã huỷ'};

/* ================= TAB NAV ================= */
document.getElementById('tabNav').addEventListener('click', e=>{
  const btn = e.target.closest('.tabbtn'); if(!btn) return;
  switchTab(btn.dataset.tab);
});

function switchTab(tab){
  state.tab = tab;
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  renderTab();
}

function renderTab(){
  const el = document.getElementById('tabContent');
  if(state.tab === 'home') el.innerHTML = homeTabHtml();
  else if(state.tab === 'book') el.innerHTML = bookTabHtml();
  else if(state.tab === 'lecturer') el.innerHTML = lecturerTabHtml();
  else if(state.tab === 'stats') el.innerHTML = statsTabHtml();
  else if(state.tab === 'api') el.innerHTML = apiTabHtml();
  bindTabEvents();
}

/* ================= TAB 0: TRANG CHỦ — bảng hội thoại đa ngôn ngữ ================= */
function computeGlobalStats(){
  const all = Object.values(state.appointments);
  const completed = all.filter(a=>a.status==='completed').length;
  const rated = all.filter(a=>a.feedback);
  const avgRating = rated.length ? (rated.reduce((s,a)=>s+a.feedback.rating,0)/rated.length).toFixed(1) : '—';
  return { lecturerCount: LECTURERS.length, unitCount: UNITS.length-1, completed, avgRating };
}

const LANG_META = {
  'Tiếng Anh':   { script:'Hello',         color:'#5B4FE8', tint:'#EDEBFC' },
  'Tiếng Nhật':  { script:'こんにちは',     color:'#E4572E', tint:'#FCEAE4' },
  'Tiếng Trung': { script:'你好',           color:'#D69A00', tint:'#FFF6E0' },
  'Tiếng Hàn':   { script:'안녕하세요',     color:'#0E8F70', tint:'#E4F5EF' },
  'Tiếng Pháp':  { script:'Bonjour',        color:'#2F80ED', tint:'#E7F0FE' },
};

function homeTabHtml(){
  const stats = computeGlobalStats();
  const units = UNITS.slice(1);
  const featured = LECTURERS.slice(0,3);
  const statDefs = [
    { n: stats.lecturerCount, l:'Giảng viên', bg:'#5B4FE8' },
    { n: stats.unitCount, l:'Ngôn ngữ', bg:'#E4572E' },
    { n: stats.completed, l:'Buổi hoàn thành', bg:'#2F80ED' },
    { n: stats.avgRating + '★', l:'Đánh giá TB', bg:'#0E8F70' },
  ];

  return `
    <div class="h2-shell">
      <section class="h2-hero">
        <div>
          <span class="h2-eyebrow"><span class="dot"></span>Phòng tư vấn ngôn ngữ</span>
          <h1>Nhắn một câu,<br>gặp đúng <span class="hl">gia sư</span><br>ngoại ngữ.</h1>
          <p class="lead">Tìm giảng viên theo ngôn ngữ, chủ đề hoặc ngày rảnh — xem khung giờ trống và gửi yêu cầu đặt lịch chỉ trong một phút.</p>
          <div class="h2-cta-row">
            <button class="h2-btn h2-btn-solid" data-goto="book">Tìm giảng viên &amp; đặt lịch</button>
            <button class="h2-btn h2-btn-outline" data-goto="lecturer">Tôi là giảng viên</button>
          </div>
        </div>
        <div class="bubble-cluster">
          ${units.map((u,i)=>{
            const m = LANG_META[u] || {color:'#211B33', tint:'#fff'};
            const align = i % 2 === 0 ? 'flex-start' : 'flex-end';
            return `<div class="bubble" style="align-self:${align}; background:${m.tint}; border-left:6px solid ${m.color}; animation-delay:${(0.12*i).toFixed(2)}s;">
              <span class="script">${escapeHtml(m.script || u)}</span>
              <span class="tag">${escapeHtml(u)}</span>
            </div>`;
          }).join('')}
        </div>
      </section>

      <section class="h2-stats">
        ${statDefs.map(s=>`<div class="h2-stat" style="background:${s.bg}"><div class="n">${s.n}</div><div class="l">${escapeHtml(s.l)}</div></div>`).join('')}
      </section>

      <section class="h2-section">
        <div class="h2-section-label">Quy trình đặt lịch</div>
        <div class="h2-section-sub">Diễn ra đơn giản như một cuộc trò chuyện</div>
        <div class="chat-thread">
          <div class="msg user" style="animation-delay:.05s">Mình cần tìm gia sư luyện IELTS Speaking 🙋</div>
          <div class="msg sys" style="animation-delay:.15s">Lọc theo ngôn ngữ, chủ đề hoặc ngày rảnh của bạn.</div>
          <div class="msg user" style="animation-delay:.25s">Có khung giờ nào chiều thứ 5 không?</div>
          <div class="msg sys" style="animation-delay:.35s">Xem lịch tuần của giảng viên và chọn giờ còn trống.</div>
          <div class="msg user" style="animation-delay:.45s">Đặt lịch được không?</div>
          <div class="msg sys" style="animation-delay:.55s">Gửi yêu cầu — chờ giảng viên duyệt là xong!</div>
          <div class="msg user" style="animation-delay:.65s">Xong buổi hẹn rồi, cảm ơn nhiều 🎉</div>
          <div class="msg sys" style="animation-delay:.75s">Đừng quên gửi đánh giá để mọi người cùng biết nhé.</div>
        </div>
      </section>

      <section class="h2-section">
        <div class="h2-section-label">5 ngôn ngữ</div>
        <div class="h2-section-sub">Chọn một ngôn ngữ để xem giảng viên phù hợp</div>
        <div class="lang-grid">
          ${units.map(u=>{
            const m = LANG_META[u] || {color:'#211B33'};
            const count = LECTURERS.filter(l=>l.unit===u).length;
            return `<button class="lang-card" data-goto-unit="${escapeHtml(u)}">
              <span class="ldot" style="background:${m.color}"></span>
              <span class="script">${escapeHtml(m.script || u)}</span>
              <span class="name">${escapeHtml(u)}</span>
              <span class="count">${count} giảng viên</span>
            </button>`;
          }).join('')}
        </div>
      </section>

      <section class="h2-section" style="padding-bottom:54px;">
        <div class="section-head" style="margin-bottom:6px; align-items:flex-start;">
          <div><div class="h2-section-label">Gợi ý cho bạn</div><div class="h2-section-sub" style="margin-bottom:0;">Vài giảng viên đang có nhiều khung giờ trống</div></div>
          <button class="h2-btn h2-btn-outline" style="padding:9px 18px; font-size:12px; box-shadow:2px 2px 0 var(--h2-ink);" data-goto="book">Xem tất cả</button>
        </div>
        <div class="feat-grid" style="margin-top:26px;">
          ${featured.map(l=>{
            const m = LANG_META[l.unit] || {color:'#211B33', tint:'#fff'};
            return `<div class="feat-card" data-open-profile="${l.id}">
              <div class="feat-avatar" style="background:${m.tint}; color:${m.color};">${l.initials}</div>
              <div class="feat-name">${escapeHtml(l.name)}</div>
              <div class="feat-topic">${escapeHtml(l.unit)} · ${escapeHtml(l.topics[0] || '')}</div>
              <span class="feat-cta">Xem hồ sơ →</span>
            </div>`;
          }).join('')}
        </div>
      </section>
    </div>
  `;
}

/* ================= TAB 1: ĐẶT LỊCH ================= */
function matchingLecturers(){
  const q = state.search.name.trim().toLowerCase();
  return LECTURERS.filter(l=>{
    const mName = !q || l.name.toLowerCase().includes(q);
    const mUnit = state.search.unit === 'Tất cả' || l.unit === state.search.unit;
    const mTopic = state.search.topic === 'Tất cả' || l.topics.includes(state.search.topic);
    if(!(mName && mUnit && mTopic)) return false;
    if(state.search.date !== 'Tất cả'){
      const has = slotsFor(l.id).some(s=> s.date===state.search.date && slotStatus(s)==='available');
      if(!has) return false;
    }
    return true;
  });
}

function bookTabHtml(){
  const lecturers = matchingLecturers();
  return `
    <h2 class="section-title">Tìm giảng viên &amp; đặt lịch tư vấn</h2>
    <p class="section-desc">Tìm theo tên giảng viên, đơn vị (ngôn ngữ), chủ đề tư vấn hoặc ngày cụ thể.</p>
    <div class="card search-card">
      <div><label class="field-label">Tên giảng viên</label><input id="sName" placeholder="Nhập tên…" style="width:100%" value="${escapeHtml(state.search.name)}"></div>
      <div><label class="field-label">Đơn vị</label><select id="sUnit" style="width:100%">${UNITS.map(u=>`<option ${u===state.search.unit?'selected':''}>${escapeHtml(u)}</option>`).join('')}</select></div>
      <div><label class="field-label">Chủ đề</label><select id="sTopic" style="width:100%"><option ${state.search.topic==='Tất cả'?'selected':''}>Tất cả</option>${allTopics().map(t=>`<option ${t===state.search.topic?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select></div>
      <div><label class="field-label">Ngày</label><select id="sDate" style="width:100%"><option ${state.search.date==='Tất cả'?'selected':''}>Tất cả</option>${DATES.map(d=>`<option value="${d.iso}" ${d.iso===state.search.date?'selected':''}>${d.weekday}, ${d.label}</option>`).join('')}</select></div>
      <button class="btn btn-ghost" id="sReset">Xoá lọc</button>
    </div>

    <div class="lecturer-grid">
      ${lecturers.map(lectCardHtml).join('') || `<div class="empty-mini" style="grid-column:1/-1">Không tìm thấy giảng viên phù hợp với bộ lọc.</div>`}
    </div>
  `;
}

function lectCardHtml(l){
  const avail = slotsFor(l.id).filter(s=> slotStatus(s)==='available' && (state.search.date==='Tất cả' || s.date===state.search.date)).length;
  return `
    <div class="lect-card">
      <div class="lect-top">
        <div class="avatar" style="background:${l.color}">${l.initials}</div>
        <div><div class="lect-name">${escapeHtml(l.name)}</div><div class="lect-unit">${escapeHtml(l.unit)} · ${escapeHtml(l.office)}</div></div>
      </div>
      <div class="topic-tags">${l.topics.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
      <div class="lect-foot">
        <span class="lect-avail">${avail} khung giờ trống</span>
        <button class="btn btn-primary btn-sm" data-open-profile="${l.id}">Xem hồ sơ</button>
      </div>
    </div>
  `;
}

function bindTabEvents(){
  if(state.tab === 'home'){
    bindHomeEvents();
  } else if(state.tab === 'book'){
    const nameEl = document.getElementById('sName');
    if(nameEl) nameEl.addEventListener('input', e=>{ state.search.name = e.target.value; renderTab(); });
    const unitEl = document.getElementById('sUnit');
    if(unitEl) unitEl.addEventListener('change', e=>{ state.search.unit = e.target.value; renderTab(); });
    const topicEl = document.getElementById('sTopic');
    if(topicEl) topicEl.addEventListener('change', e=>{ state.search.topic = e.target.value; renderTab(); });
    const dateEl = document.getElementById('sDate');
    if(dateEl) dateEl.addEventListener('change', e=>{ state.search.date = e.target.value; renderTab(); });
    const resetEl = document.getElementById('sReset');
    if(resetEl) resetEl.addEventListener('click', ()=>{ state.search = {name:'',unit:'Tất cả',topic:'Tất cả',date:'Tất cả'}; renderTab(); });
    document.querySelectorAll('[data-open-profile]').forEach(btn=>{
      btn.addEventListener('click', ()=> openProfilePanel(btn.dataset.openProfile));
    });
  } else if(state.tab === 'lecturer'){
    bindLecturerTabEvents();
  } else if(state.tab === 'api'){
    bindApiTabEvents();
  }
}

function bindHomeEvents(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click', ()=> switchTab(b.dataset.goto)));
  document.querySelectorAll('[data-goto-unit]').forEach(b=>b.addEventListener('click', ()=>{
    state.search.unit = b.dataset.gotoUnit; switchTab('book');
  }));
  document.querySelectorAll('[data-open-profile]').forEach(btn=>{
    btn.addEventListener('click', ()=> openProfilePanel(btn.dataset.openProfile));
  });
}

/* ---- Student profile / booking panel ---- */
function openProfilePanel(lecturerId){
  state.panel = { mode:'profile', lecturerId, slotId:null, apId:null, day: firstAvailDayIndex(lecturerId) };
  renderPanel(); openPanelUI();
}
function firstAvailDayIndex(lecturerId){
  const idx = DATES.findIndex(d => slotsFor(lecturerId).some(s=>s.date===d.iso && slotStatus(s)==='available'));
  return idx >= 0 ? idx : 0;
}
function openPanelUI(){ document.getElementById('panel').classList.add('show'); document.getElementById('backdrop').classList.add('show'); }
function closePanel(){ document.getElementById('panel').classList.remove('show'); document.getElementById('backdrop').classList.remove('show'); }
document.getElementById('panelClose').addEventListener('click', closePanel);
document.getElementById('backdrop').addEventListener('click', closePanel);
document.getElementById('myBookingsBtn').addEventListener('click', ()=>{ state.panel = {mode:'mybookings'}; renderPanel(); openPanelUI(); });

function renderPanel(){
  const title = document.getElementById('panelTitle');
  const body = document.getElementById('panelBody');
  const p = state.panel;

  if(p.mode === 'profile'){
    const lec = lecturerById(p.lecturerId);
    title.textContent = 'Hồ sơ giảng viên';
    const dt = DATES[p.day];
    const daySlots = slotsFor(lec.id).filter(s=>s.date===dt.iso);
    body.innerHTML = `
      <div class="plaque">
        <div class="pname">${escapeHtml(lec.name)}</div>
        <div class="punit">${escapeHtml(lec.unit)} · ${escapeHtml(lec.office)}</div>
        <div class="pbio">${escapeHtml(lec.bio)}</div>
        <div class="ptags">${lec.topics.map(t=>`<span>${escapeHtml(t)}</span>`).join('')}</div>
      </div>
      <div class="daytabs">${DATES.map((d,i)=>`<button class="daytab ${i===p.day?'active':''}" data-day="${i}"><span class="d">${d.label}</span>${d.weekday}</button>`).join('')}</div>
      <div class="slot-grid">${daySlots.map(s=>slotBtnHtml(s)).join('') || `<div class="empty-mini">Không có khung giờ nào cho ngày này.</div>`}</div>
    `;
    body.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click', ()=>{ state.panel.day = Number(b.dataset.day); renderPanel(); }));
    body.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click', ()=> onStudentSlotClick(b.dataset.slot)));

  } else if(p.mode === 'book'){
    const s = slotById(p.slotId); const lec = lecturerById(s.lecturerId); const dt = dateInfo(s.date);
    title.textContent = 'Đặt lịch hẹn';
    body.innerHTML = `
      <div>
        <div class="info-line"><span>Giảng viên</span><span>${escapeHtml(lec.name)}</span></div>
        <div class="info-line"><span>Thời gian</span><span>${dt.weekday}, ${dt.label} · ${s.time}</span></div>
        <div class="info-line"><span>Địa điểm</span><span>${escapeHtml(lec.office)}</span></div>
      </div>
      <div><label class="field-label">Họ và tên</label><input id="bkName" style="width:100%" placeholder="Nhập họ tên của bạn"></div>
      <div><label class="field-label">Email / SĐT liên hệ</label><input id="bkContact" style="width:100%" placeholder="email@sv.edu.vn"></div>
      <div><label class="field-label">Chủ đề tư vấn</label>
        <select id="bkTopic" style="width:100%">${lec.topics.map(t=>`<option>${escapeHtml(t)}</option>`).join('')}</select>
      </div>
      <div><label class="field-label">Ghi chú</label><textarea id="bkNote" style="width:100%" rows="3" placeholder="Mô tả ngắn gọn nội dung muốn trao đổi…"></textarea></div>
      <p class="section-desc">Yêu cầu sẽ ở trạng thái <strong>Chờ duyệt</strong> cho đến khi giảng viên xác nhận.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="bkCancel">Huỷ</button>
        <button class="btn btn-primary" id="bkConfirm">Gửi yêu cầu đặt lịch</button>
      </div>
    `;
    document.getElementById('bkCancel').addEventListener('click', ()=>{ state.panel={mode:'profile', lecturerId:lec.id, day:DATES.findIndex(d=>d.iso===s.date)}; renderPanel(); });
    document.getElementById('bkConfirm').addEventListener('click', ()=>{
      const name = document.getElementById('bkName').value.trim() || 'Sinh viên ẩn danh';
      const contact = document.getElementById('bkContact').value.trim() || '—';
      const topic = document.getElementById('bkTopic').value;
      const note = document.getElementById('bkNote').value.trim() || '—';
      const ap = { id:'ap-'+s.id, slotId:s.id, lecturerId:lec.id, date:s.date, time:s.time, topic, studentName:name, contact, note, status:'pending', feedback:null, createdAt:s.date };
      state.appointments[ap.id] = ap;
      s.appointmentId = ap.id;
      state.myBookingIds.push(ap.id);
      updateMyBookingsCount();
      showToast('Đã gửi yêu cầu đặt lịch, đang chờ giảng viên duyệt.');
      state.panel = {mode:'profile', lecturerId:lec.id, day:DATES.findIndex(d=>d.iso===s.date)};
      renderPanel(); renderTab();
    });

  } else if(p.mode === 'mybookings'){
    title.textContent = 'Lịch hẹn của tôi';
    const items = state.myBookingIds.map(apById).filter(Boolean).sort((a,b)=> a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
    if(items.length===0){
      body.innerHTML = `<div class="empty-mini">Bạn chưa có lịch hẹn nào. Hãy tìm giảng viên và gửi yêu cầu đặt lịch.</div>`;
    } else {
      body.innerHTML = items.map(ap=>{
        const lec = lecturerById(ap.lecturerId); const dt = dateInfo(ap.date);
        let actions = '';
        if(ap.status==='pending' || ap.status==='approved'){
          actions = `<div class="bi-actions"><button class="btn btn-danger btn-sm" data-cancel-ap="${ap.id}">Huỷ lịch hẹn</button></div>`;
        } else if(ap.status==='completed' && !ap.feedback){
          actions = `<div class="bi-actions"><button class="btn btn-primary btn-sm" data-feedback-ap="${ap.id}">Gửi phản hồi</button></div>`;
        } else if(ap.status==='completed' && ap.feedback){
          actions = `<div class="req-feedback">${'★'.repeat(ap.feedback.rating)}${'☆'.repeat(5-ap.feedback.rating)} — ${escapeHtml(ap.feedback.comment)}</div>`;
        }
        return `
          <div class="booking-item">
            <div class="bi-top"><span class="bi-name">${escapeHtml(lec.name)}</span><span class="badge-status badge-${ap.status}">${STATUS_LABEL[ap.status]}</span></div>
            <div class="bi-time">${dt ? dt.weekday+', '+dt.label : ap.date} · ${ap.time}</div>
            <div class="bi-topic">${escapeHtml(ap.topic)}</div>
            ${actions}
          </div>
        `;
      }).join('');
      body.querySelectorAll('[data-cancel-ap]').forEach(btn=>btn.addEventListener('click', ()=> cancelAppointment(btn.dataset.cancelAp)));
      body.querySelectorAll('[data-feedback-ap]').forEach(btn=>btn.addEventListener('click', ()=>{ state.panel={mode:'feedback', apId:btn.dataset.feedbackAp}; state.bookingRating=0; renderPanel(); }));
    }

  } else if(p.mode === 'feedback'){
    const ap = apById(p.apId); const lec = lecturerById(ap.lecturerId);
    title.textContent = 'Gửi phản hồi';
    body.innerHTML = `
      <div class="info-line"><span>Giảng viên</span><span>${escapeHtml(lec.name)}</span></div>
      <div class="info-line"><span>Chủ đề</span><span>${escapeHtml(ap.topic)}</span></div>
      <div><label class="field-label">Đánh giá</label><div class="stars" id="starRow">${[1,2,3,4,5].map(n=>`<button type="button" class="star-btn ${n<=state.bookingRating?'on':''}" data-star="${n}">★</button>`).join('')}</div></div>
      <div><label class="field-label">Nhận xét</label><textarea id="fbComment" rows="4" style="width:100%" placeholder="Chia sẻ trải nghiệm buổi tư vấn…"></textarea></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="fbCancel">Huỷ</button>
        <button class="btn btn-primary" id="fbSubmit">Gửi phản hồi</button>
      </div>
    `;
    body.querySelectorAll('[data-star]').forEach(b=>b.addEventListener('click', ()=>{ state.bookingRating = Number(b.dataset.star); renderPanel(); }));
    document.getElementById('fbCancel').addEventListener('click', ()=>{ state.panel={mode:'mybookings'}; renderPanel(); });
    document.getElementById('fbSubmit').addEventListener('click', ()=>{
      const comment = document.getElementById('fbComment').value.trim() || '—';
      ap.feedback = { rating: state.bookingRating || 5, comment };
      state.panel = {mode:'mybookings'};
      renderPanel();
      showToast('Cảm ơn bạn đã gửi phản hồi!');
    });
  }
}

function slotBtnHtml(s){
  const status = slotStatus(s);
  const isMine = state.myBookingIds.includes(s.appointmentId);
  const displayStatus = isMine ? 'mine' : status;
  let sub = STATUS_LABEL[status] || status;
  if(isMine) sub = 'Của bạn · ' + STATUS_LABEL[status];
  const clickable = status === 'available' || isMine;
  return `
    <button class="slot" ${clickable?'':'disabled style="cursor:default"'} data-slot="${s.id}" data-status="${displayStatus}">
      <span class="time">${s.time}</span><span class="st">${sub}</span>
    </button>
  `;
}

function onStudentSlotClick(slotId){
  const s = slotById(slotId); const status = slotStatus(s);
  const isMine = state.myBookingIds.includes(s.appointmentId);
  if(status === 'available'){ state.panel = {mode:'book', slotId, lecturerId:s.lecturerId}; renderPanel(); }
  else if(isMine){ state.panel = {mode:'mybookings'}; renderPanel(); }
}

function cancelAppointment(apId){
  const ap = apById(apId); if(!ap) return;
  ap.status = 'cancelled';
  const s = slotById(ap.slotId); if(s) s.appointmentId = null;
  renderPanel(); renderTab();
  showToast('Đã huỷ lịch hẹn.');
}

function updateMyBookingsCount(){ document.getElementById('myBookingsCount').textContent = state.myBookingIds.length; }

/* ================= TAB 2: GIẢNG VIÊN ================= */

  const lec = lecturerById(state.lecturerLoginId);
  return `
    <h2 class="section-title">Khu vực giảng viên</h2>
    <p class="section-desc">Quản lý hồ sơ, khung giờ tư vấn và duyệt các yêu cầu đặt lịch.</p>
    <div class="card" style="margin-bottom:18px;">
      <label class="field-label" for="lecLogin">Đăng nhập với vai trò</label>
      <select id="lecLogin" style="width:100%; max-width:360px;">
        ${LECTURERS.map(l=>`<option value="${l.id}" ${l.id===state.lecturerLoginId?'selected':''}>${escapeHtml(l.name)} — ${escapeHtml(l.unit)}</option>`).join('')}
      </select>
    </div>

    <div class="subtabs" id="lecSubtabs">
      <button class="subtab ${state.lecturerSubtab==='profile'?'active':''}" data-sub="profile">Hồ sơ &amp; lĩnh vực</button>
      <button class="subtab ${state.lecturerSubtab==='slots'?'active':''}" data-sub="slots">Khung giờ tư vấn</button>

function lecturerSubcontent(lec){
  if(state.lecturerSubtab === 'profile') return lecturerProfileHtml(lec);
  if(state.lecturerSubtab === 'slots') return lecturerSlotsHtml(lec);
  return lecturerRequestsHtml(lec);
}

function lecturerProfileHtml(lec){
  return `
    <div class="card stack">
      <div>
        <label class="field-label">Họ tên</label>
        <input value="${escapeHtml(lec.name)}" disabled style="width:100%; max-width:420px; background:var(--paper-card);">
      </div>
      <div>
        <label class="field-label">Đơn vị (ngôn ngữ)</label>
        <input value="${escapeHtml(lec.unit)}" disabled style="width:100%; max-width:420px; background:var(--paper-card);">
      </div>
      <div>
        <label class="field-label">Phòng làm việc</label>
        <input id="pfOffice" value="${escapeHtml(lec.office)}" style="width:100%; max-width:420px;">
      </div>
      <div>
        <label class="field-label">Giới thiệu</label>
        <textarea id="pfBio" rows="3" style="width:100%; max-width:520px;">${escapeHtml(lec.bio)}</textarea>
      </div>
      <div>
        <label class="field-label">Lĩnh vực tư vấn</label>
        <div class="chip-row" id="pfTopics">${lec.topics.map((t,i)=>`<span class="chip">${escapeHtml(t)}<button data-remove-topic="${i}">✕</button></span>`).join('')}</div>
        <div class="addtopic-row">
          <input id="pfNewTopic" placeholder="Thêm lĩnh vực mới…" style="max-width:260px;">
          <button class="btn btn-ghost btn-sm" id="pfAddTopic">+ Thêm</button>
        </div>
      </div>
      <div><button class="btn btn-primary" id="pfSave">Lưu hồ sơ</button></div>
    </div>
  `;
}

function lecturerSlotsHtml(lec){
  const daySlots = slotsFor(lec.id).filter(s=>s.date===state.slotsDay).sort((a,b)=>a.time.localeCompare(b.time));
  return `
    <div class="card">
      <div class="daytabs" style="margin-bottom:14px;">${DATES.map(d=>`<button class="daytab ${d.iso===state.slotsDay?'active':''}" data-slotday="${d.iso}"><span class="d">${d.label}</span>${d.weekday}</button>`).join('')}</div>
      <div id="slotRows">
        ${daySlots.map(s=>slotRowHtml(s)).join('') || `<div class="empty-mini">Chưa có khung giờ nào cho ngày này.</div>`}
      </div>
      <div class="add-slot-form">
        <div><label class="field-label">Giờ bắt đầu (HH:MM)</label><input id="newSlotTime" placeholder="vd. 10:15" style="width:120px;"></div>
        <button class="btn btn-primary btn-sm" id="addSlotBtn">+ Thêm khung giờ</button>
      </div>
    </div>
  `;
}

function slotRowHtml(s){
  const status = slotStatus(s);
  const ap = s.appointmentId ? apById(s.appointmentId) : null;
  let actions = '';
  if(status === 'available'){
    actions = state.pendingDelete === s.id
      ? `<span style="font-size:12px;color:var(--rust);">Xác nhận xoá?</span><button class="btn btn-danger btn-sm" data-confirm-del="${s.id}">Xoá</button><button class="btn btn-ghost btn-sm" data-cancel-del="${s.id}">Không</button>`
      : `<button class="btn btn-ghost btn-sm" data-edit="${s.id}">Sửa</button><button class="btn btn-ghost btn-sm" data-close="${s.id}">Đóng</button><button class="btn btn-danger btn-sm" data-del="${s.id}">Xoá</button>`;
  } else if(status === 'closed'){
    actions = `<button class="btn btn-sage btn-sm" data-reopen="${s.id}">Mở lại</button><button class="btn btn-danger btn-sm" data-del="${s.id}">Xoá</button>`;
  } else {
    actions = `<span style="font-size:11.5px;color:var(--ink-soft);">${ap ? escapeHtml(ap.studentName) : ''} — xem ở tab Yêu cầu</span>`;
  }
  return `
    <div class="slot-row">
      <span class="st-time">${s.time}</span>
      <span class="badge-status badge-${status}">${STATUS_LABEL[status]}</span>
      <span class="st-meta">${s.session==='AM'?'Buổi sáng':'Buổi chiều'}</span>
      <div class="st-actions">${actions}</div>
    </div>
  `;
}

function lecturerRequestsHtml(lec){
  const all = Object.values(state.appointments).filter(a=>a.lecturerId===lec.id);
  const counts = { pending:0, approved:0, completed:0, other:0 };
  all.forEach(a=>{
    if(a.status==='pending') counts.pending++;
    else if(a.status==='approved') counts.approved++;
    else if(a.status==='completed') counts.completed++;
    else counts.other++;
  });
  const filters = [['pending','Chờ duyệt ('+counts.pending+')'],['approved','Đã duyệt ('+counts.approved+')'],['completed','Hoàn thành ('+counts.completed+')'],['other','Đã huỷ / Từ chối ('+counts.other+')']];
  let list;
  if(state.reqFilter === 'other') list = all.filter(a=>a.status==='cancelled'||a.status==='rejected');
  else list = all.filter(a=>a.status===state.reqFilter);
  list = list.sort((a,b)=> a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

  return `
    <div class="subtabs" id="reqFilters">${filters.map(([k,l])=>`<button class="subtab ${state.reqFilter===k?'active':''}" data-reqf="${k}">${l}</button>`).join('')}</div>
    <div id="reqList">
      ${list.map(a=>requestItemHtml(a)).join('') || `<div class="empty-mini">Không có yêu cầu nào ở trạng thái này.</div>`}
    </div>
  `;
}

function requestItemHtml(ap){
  const dt = dateInfo(ap.date);
  let actions = '';
  if(ap.status === 'pending') actions = `<div class="req-actions"><button class="btn btn-sky btn-sm" data-approve="${ap.id}">Duyệt</button><button class="btn btn-danger btn-sm" data-reject="${ap.id}">Từ chối</button></div>`;
  else if(ap.status === 'approved') actions = `<div class="req-actions"><button class="btn btn-primary btn-sm" data-complete="${ap.id}">Đánh dấu hoàn thành</button></div>`;
  let feedbackHtml = '';
  if(ap.status === 'completed'){
    feedbackHtml = ap.feedback
      ? `<div class="req-feedback">Phản hồi: ${'★'.repeat(ap.feedback.rating)}${'☆'.repeat(5-ap.feedback.rating)} — ${escapeHtml(ap.feedback.comment)}</div>`
      : `<div class="req-feedback" style="color:var(--ink-soft)">Sinh viên chưa gửi phản hồi.</div>`;
  }
  return `
    <div class="req-item">
      <div class="req-top">
        <div><div class="req-student">${escapeHtml(ap.studentName)}</div><div class="req-meta">${escapeHtml(ap.contact)} · ${escapeHtml(ap.topic)}</div></div>
        <div><span class="badge-status badge-${ap.status}">${STATUS_LABEL[ap.status]}</span><div class="req-meta" style="text-align:right;margin-top:4px;">${dt?dt.weekday+', '+dt.label:ap.date} · ${ap.time}</div></div>
      </div>
      <div class="req-note">${escapeHtml(ap.note)}</div>
      ${actions}${feedbackHtml}
    </div>
  `;
}

function bindLecturerTabEvents(){
  const loginEl = document.getElementById('lecLogin');
  if(loginEl) loginEl.addEventListener('change', e=>{ state.lecturerLoginId = e.target.value; renderTab(); });
  document.querySelectorAll('#lecSubtabs [data-sub]').forEach(b=>b.addEventListener('click', ()=>{ state.lecturerSubtab = b.dataset.sub; renderTab(); }));

  const lec = lecturerById(state.lecturerLoginId);

  if(state.lecturerSubtab === 'profile'){
    const saveBtn = document.getElementById('pfSave');
    if(saveBtn) saveBtn.addEventListener('click', ()=>{
      lec.office = document.getElementById('pfOffice').value.trim() || lec.office;
      lec.bio = document.getElementById('pfBio').value.trim() || lec.bio;
      showToast('Đã lưu hồ sơ.'); renderTab();
    });
    document.querySelectorAll('[data-remove-topic]').forEach(b=>b.addEventListener('click', ()=>{
      lec.topics.splice(Number(b.dataset.removeTopic),1); renderTab();
    }));
    const addTopicBtn = document.getElementById('pfAddTopic');
    if(addTopicBtn) addTopicBtn.addEventListener('click', ()=>{
      const v = document.getElementById('pfNewTopic').value.trim();
      if(v){ lec.topics.push(v); renderTab(); }
    });

  } else if(state.lecturerSubtab === 'slots'){
    document.querySelectorAll('[data-slotday]').forEach(b=>b.addEventListener('click', ()=>{ state.slotsDay = b.dataset.slotday; state.pendingDelete=null; renderTab(); }));
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>{ slotById(b.dataset.close).baseStatus='closed'; renderTab(); }));
    document.querySelectorAll('[data-reopen]').forEach(b=>b.addEventListener('click', ()=>{ slotById(b.dataset.reopen).baseStatus='available'; renderTab(); }));
    document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{ state.pendingDelete = b.dataset.del; renderTab(); }));
    document.querySelectorAll('[data-cancel-del]').forEach(b=>b.addEventListener('click', ()=>{ state.pendingDelete=null; renderTab(); }));
    document.querySelectorAll('[data-confirm-del]').forEach(b=>b.addEventListener('click', ()=>{
      state.slots = state.slots.filter(s=>s.id!==b.dataset.confirmDel); state.pendingDelete=null; renderTab();
      showToast('Đã xoá khung giờ.');
    }));
    document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
      const s = slotById(b.dataset.edit);
      const nt = prompt('Nhập giờ mới (HH:MM):', s.time);
      if(nt && /^\d{1,2}:\d{2}$/.test(nt)){ s.time = nt.length===4?'0'+nt:nt; s.session = s.time < '12:00' ? 'AM':'PM'; renderTab(); showToast('Đã cập nhật khung giờ.'); }
      else if(nt !== null){ showToast('Định dạng giờ không hợp lệ (vd. 10:15).'); }
    }));
    const addSlotBtn = document.getElementById('addSlotBtn');
    if(addSlotBtn) addSlotBtn.addEventListener('click', ()=>{
      let t = document.getElementById('newSlotTime').value.trim();
      if(!/^\d{1,2}:\d{2}$/.test(t)){ showToast('Định dạng giờ không hợp lệ (vd. 10:15).'); return; }
      if(t.length===4) t = '0'+t;
      const id = `${lec.id}_${state.slotsDay}_${t}_${Date.now()}`;
      state.slots.push({id, lecturerId:lec.id, date:state.slotsDay, time:t, session: t<'12:00'?'AM':'PM', baseStatus:'available', appointmentId:null});
      renderTab(); showToast('Đã thêm khung giờ mới.');
    });

  } else if(state.lecturerSubtab === 'requests'){
    document.querySelectorAll('[data-reqf]').forEach(b=>b.addEventListener('click', ()=>{ state.reqFilter=b.dataset.reqf; renderTab(); }));
    document.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click', ()=>{ apById(b.dataset.approve).status='approved'; renderTab(); showToast('Đã duyệt lịch hẹn.'); }));
    document.querySelectorAll('[data-reject]').forEach(b=>b.addEventListener('click', ()=>{
      const ap = apById(b.dataset.reject); ap.status='rejected'; const s=slotById(ap.slotId); if(s) s.appointmentId=null;
      renderTab(); showToast('Đã từ chối yêu cầu, khung giờ mở lại.');
    }));
    document.querySelectorAll('[data-complete]').forEach(b=>b.addEventListener('click', ()=>{ apById(b.dataset.complete).status='completed'; renderTab(); showToast('Đã đánh dấu hoàn thành.'); }));
  }
}

/* ================= TAB 3: THỐNG KÊ ================= */
function statsTabHtml(){
  const all = Object.values(state.appointments);
  const total = all.length;
  const pending = all.filter(a=>a.status==='pending').length;
  const approved = all.filter(a=>a.status==='approved').length;
  const completed = all.filter(a=>a.status==='completed').length;
  const closedOut = all.filter(a=>a.status==='rejected'||a.status==='cancelled').length;
  const rated = all.filter(a=>a.feedback);
  const avgRating = rated.length ? (rated.reduce((s,a)=>s+a.feedback.rating,0)/rated.length).toFixed(1) : '—';

  const maxTotal = Math.max(1, ...LECTURERS.map(l=>Object.values(state.appointments).filter(a=>a.lecturerId===l.id).length));

  const rows = LECTURERS.map(l=>{
    const mine = all.filter(a=>a.lecturerId===l.id);
    const done = mine.filter(a=>a.status==='completed').length;
    const rated2 = mine.filter(a=>a.feedback);
    const avg = rated2.length ? (rated2.reduce((s,a)=>s+a.feedback.rating,0)/rated2.length).toFixed(1) : '—';
    const pct = Math.round((mine.length/maxTotal)*100);
    return `<tr>
      <td>${escapeHtml(l.name)}</td><td>${escapeHtml(l.unit)}</td>
      <td>${mine.length}</td><td>${done}</td><td>${avg}</td>
      <td><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div></td>
    </tr>`;
  }).join('');

  return `
    <h2 class="section-title">Thống kê cuộc hẹn</h2>
    <p class="section-desc">Tổng quan số lượng cuộc hẹn và phản hồi trên toàn hệ thống.</p>
    <div class="stat-cards">
      <div class="stat-card"><div class="n">${total}</div><div class="l">Tổng cuộc hẹn</div></div>
      <div class="stat-card"><div class="n">${pending}</div><div class="l">Chờ duyệt</div></div>
      <div class="stat-card"><div class="n">${approved}</div><div class="l">Đã duyệt</div></div>
      <div class="stat-card"><div class="n">${completed}</div><div class="l">Hoàn thành</div></div>
      <div class="stat-card"><div class="n">${closedOut}</div><div class="l">Huỷ / Từ chối</div></div>
      <div class="stat-card"><div class="n">${avgRating}★</div><div class="l">Đánh giá TB</div></div>
    </div>
    <table class="stats-table">
      <thead><tr><th>Giảng viên</th><th>Đơn vị</th><th>Tổng cuộc hẹn</th><th>Hoàn thành</th><th>Đánh giá TB</th><th>Tỷ lệ</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

/* ================= TAB 4: API ================= */
function buildSlotsJSON(lecturerId, date){
  const lec = lecturerById(lecturerId);
  const list = slotsFor(lecturerId).filter(s=>s.date===date && slotStatus(s)==='available').map(s=>({time:s.time, session:s.session}));
  return { status:200, endpoint:`/api/lecturers/${lecturerId}/slots`, params:{date}, lecturer:{id:lec.id, name:lec.name, unit:lec.unit}, available_slots:list, count:list.length };
}

function apiTabHtml(){
  return `
    <h2 class="section-title">API — Slot trống theo giảng viên &amp; ngày</h2>
    <p class="section-desc">Endpoint mô phỏng trả về danh sách khung giờ còn trống dạng JSON, dùng cho ứng dụng hoặc hệ thống khác tích hợp.</p>
    <div class="api-grid">
      <div class="card">
        <span class="endpoint-tag">GET /api/lecturers/{id}/slots?date=YYYY-MM-DD</span>
        <div style="margin-top:6px;"><label class="field-label">Giảng viên</label>
          <select id="apiLect" style="width:100%">${LECTURERS.map(l=>`<option value="${l.id}" ${l.id===state.api.lecturerId?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select>
        </div>
        <div style="margin-top:10px;"><label class="field-label">Ngày</label>
          <select id="apiDate" style="width:100%">${DATES.map(d=>`<option value="${d.iso}" ${d.iso===state.api.date?'selected':''}>${d.weekday}, ${d.label} (${d.iso})</option>`).join('')}</select>
        </div>
        <button class="btn btn-primary" id="apiSend" style="margin-top:14px;">Gửi yêu cầu (GET)</button>
      </div>
      <div class="card">
        <span class="endpoint-tag">200 OK · application/json</span>
        <pre class="json-block" id="apiOutput">${state.api.result ? syntaxJson(state.api.result) : 'Chọn giảng viên và ngày, sau đó bấm "Gửi yêu cầu" để xem kết quả JSON.'}</pre>
      </div>
    </div>
  `;
}

function syntaxJson(obj){
  const str = JSON.stringify(obj, null, 2);
  return escapeHtml(str)
    .replace(/&quot;([^&]+)&quot;(:)/g, '<span class="json-key">&quot;$1&quot;</span>$2')
    .replace(/: &quot;([^&]*)&quot;/g, ': <span class="json-str">&quot;$1&quot;</span>')
    .replace(/: (\d+)/g, ': <span class="json-num">$1</span>');
}

function bindApiTabEvents(){
  document.getElementById('apiLect').addEventListener('change', e=>{ state.api.lecturerId = e.target.value; });
  document.getElementById('apiDate').addEventListener('change', e=>{ state.api.date = e.target.value; });
  document.getElementById('apiSend').addEventListener('click', ()=>{
    state.api.result = buildSlotsJSON(state.api.lecturerId, state.api.date);
    document.getElementById('apiOutput').innerHTML = syntaxJson(state.api.result);
  });
}

/* ================= INIT ================= */
renderTab();
updateMyBookingsCount();
})();
</script>
</body>
</html>
